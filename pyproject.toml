[tool.poetry]
name = "edge-benchmarking-client"
version = "0.3.0"
description = "Client library for the AgrifoodTEF Edge Benchmarking Service"
authors = ["Andreas Schliebitz <a.schliebitz@hs-osnabrueck.de>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "edge_benchmarking_client" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
requests = "2.33.0"
validators = "0.34.0"
python-dotenv = "1.2.2"
# Pinned to the branch, not left on the default one. Without a ref this
# resolves GitHub's main, which trails the working branches badly -- the
# platform backend was running types 0.3.0 this way while edge-farm ran 0.5.0,
# so BenchmarkConfig.execution_mode did not exist on the platform side and
# every device-mode job died with AttributeError.
#
# The platform is a live consumer that gets types only transitively, through
# this package, so this pin is what decides its contract version.
edge-benchmarking-types = { git = "https://github.com/agrifoodTEF-de/edge-benchmarking-types.git", branch = "feature/birdnet" }

[tool.poetry.group.dev.dependencies]
black = "26.3.1"
numpy = "1.26.4"
matplotlib = "3.10.0"
pandas = "2.2.3"
torch = "2.8.0"
pytest = "9.0.3"
ipykernel = "^7.2.0"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
